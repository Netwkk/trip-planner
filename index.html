<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trip Planner">
  <title>Trip Planner ✈️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #FAF9F5;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      border: none;
      z-index: 1;
    }
    /* หน้าจอโหลดและปุ่มสำรองเผื่อ Safari บล็อกคุกกี้ข้ามโดเมน */
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: #FAF9F5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 0;
      padding: 24px;
      text-align: center;
      color: #555;
    }
    .fallback-btn {
      margin-top: 16px;
      background: #3E7B5D;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="loadingScreen">
    <div style="font-size: 32px; margin-bottom: 10px;">✈️</div>
    <div style="font-size: 15px; font-weight: 600; color: #333;">กำลังเปิด Trip Planner...</div>
    <div style="font-size: 12px; color: #888; margin-top: 6px;">หากหน้าจอค้างหรือขึ้น Error 401 ให้กดปุ่มด้านล่าง</div>
    <a id="directLinkBtn" href="#" class="fallback-btn">เปิดแอปโดยตรง</a>
  </div>

  <iframe 
    id="gasFrame"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

  <script>
    // นำลิงก์ /exec อันใหม่มาวางตรงนี้
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbx56YbJ22017i--N3aDGmeBGlftZxFMvccs7r6TdaHNCwmncCi2c3FrXszpYfP0pmec/exec".trim();
    
    // เพิ่มพารามิเตอร์ป้องกันการแคชและบังคับไม่ให้ติด /u/0/
    var cleanUrl = EXEC_URL.replace(/\/macros\/u\/\d+\/s\//, "/macros/s/");
    document.getElementById("directLinkBtn").href = cleanUrl;
    document.getElementById("gasFrame").src = cleanUrl;
  </script>
</body>
</html>
